<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <div class="login-container">

        <h1>Bank Management System</h1>

        <h2>Create Account</h2>

        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        {% if account_id %}

            <div class="success">

                <h3>Account Created Successfully!</h3>

                <p>Your Account ID is:</p>

                <strong>{{ account_id }}</strong>

                <br><br>

                <a href="{{ url_for('login') }}">
                    Go to Login
                </a>

            </div>

        {% else %}

            <form method="POST">

                <label>Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your name"
                    required
                >


                <label>Phone Number</label>

                <input
                    type="text"
                    name="phone"
                    placeholder="Enter 10-digit phone number"
                    maxlength="10"
                    required
                >


                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <label>PIN</label>

                <input
                    type="password"
                    name="pin"
                    placeholder="Enter 4-digit PIN"
                    maxlength="4"
                    required
                >


                <label>Confirm PIN</label>

                <input
                    type="password"
                    name="confirm_pin"
                    placeholder="Confirm your PIN"
                    maxlength="4"
                    required
                >


                <button type="submit">
                    Create Account
                </button>

            </form>


            <p>
                Already have an account?

                <a href="{{ url_for('login') }}">
                    Login
                </a>
            </p>

        {% endif %}

    </div>

</body>

</html>
